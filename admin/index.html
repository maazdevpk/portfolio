function mergeMissingFields(saved,seed){
 const out=JSON.parse(JSON.stringify(saved||{}));
 const mergeCollection=(key,idKey)=>{
   const source=seed[key]||[], target=out[key]||[];
   source.forEach(s=>{
     let t=target.find(x=>String(x[idKey]||'').trim().toLowerCase()===String(s[idKey]||'').trim().toLowerCase());
     if(!t){target.push(JSON.parse(JSON.stringify(s)));return}
     Object.keys(s).forEach(k=>{if(t[k]===undefined||t[k]===null||t[k]==='')t[k]=s[k]});
   });
   out[key]=target;
 };
 mergeCollection('services','title');mergeCollection('projects','title');
 mergeCollection('testimonials','quote');
 return out;
}

async function seed(){
 const saved=localStorage.getItem(STORAGE_KEY);
 if(saved){db=mergeMissingFields(JSON.parse(saved),EMBEDDED_SEED);localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return}
 db=JSON.parse(JSON.stringify(EMBEDDED_SEED));

}
async function api(method,body){

 let j=await r.json().catch(()=>({})); if(!r.ok)throw Error(j.error||'Request failed'); return j;
}
async function login(){
 try{
   if(localMode){
     if($('#password').value!==LOCAL_PASSWORD) throw Error('Incorrect local password');
     sessionStorage.setItem('cmsLocalAuth','1'); await boot(); return;
   }
   let j=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:$('#password').value})}).then(r=>r.json());
   if(!j.token)throw Error(j.error||'Login failed'); token=j.token;sessionStorage.setItem('cmsToken',token);await boot()
 }catch(e){$('#loginMsg').textContent=e.message}
}

 }

}
